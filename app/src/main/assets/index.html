<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101321"><title>ПАША 2.3</title><style>*{box-sizing:border-box}body{margin:0;background:#101321;color:#f4f5ff;font:16px system-ui,sans-serif}main{max-width:600px;margin:auto;padding:24px 18px 100px}small,.muted{color:#a0a9c4}h1{font-size:34px;margin:8px 0}h2{font-size:20px}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:14px;padding:12px;color:inherit;background:#252b43}button.primary{background:#6559e8}section,.hero{background:#1b2033;border:1px solid #303750;border-radius:22px;padding:18px;margin:14px 0}.hero{background:linear-gradient(125deg,#393078,#1c2847);position:relative;overflow:hidden}.hero strong{font-size:38px}.bar{height:8px;background:#ffffff25;border-radius:10px;overflow:hidden;margin:14px 0}.bar i{display:block;height:100%;background:#9b9cff;border-radius:10px}.task{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid #303750}.task:last-child{border:0}.task input{width:23px;height:23px;accent-color:#8278ff}.task span{flex:1}.task.done span{text-decoration:line-through;color:#939bb2}.task button{padding:7px 10px}.top{display:flex;justify-content:space-between;align-items:center}.tag{font-size:12px;letter-spacing:2px;color:#a9a6ff}nav{position:fixed;bottom:0;left:0;right:0;background:#191e30;border-top:1px solid #343b54;display:flex;justify-content:center;padding:8px 4px max(12px,env(safe-area-inset-bottom));gap:4px}nav button{background:none;font-size:12px;min-width:70px}nav b{display:block;font-size:22px;margin-bottom:4px}nav .active{color:#b5afff;background:#292745}input:not([type=checkbox]),select,textarea{width:100%;background:#111626;color:inherit;border:1px solid #414963;border-radius:12px;padding:12px;margin:6px 0 12px}label{display:block;color:#b8c0d7;font-size:14px}.light{background:#edf0f8;color:#20243a}.light section,.light nav{background:#fff;border-color:#d8ddec}.light input:not([type=checkbox]),.light select,.light textarea{background:#f0f2fa;color:#20243a}.light button{background:#e0e4f4}.light .hero,.light .primary{color:white}.light .muted,.light small{color:#626d88}.light nav .active{color:#5144bd}dialog{width:min(92%,440px);background:#1b2033;color:white;border:1px solid #414963;border-radius:22px;padding:22px}dialog::backdrop{background:#0009}.days{display:flex;gap:5px;flex-wrap:wrap}.days label{padding:6px}.stat{display:flex;justify-content:space-between;align-items:center;gap:10px}.stat .bar{flex:1}.wide{width:100%;margin:8px 0}.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week button{padding:12px 2px;font-size:13px}.week .selected{background:#6559e8;color:white}.days{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}.days label{background:#252b43;border-radius:10px;display:flex;align-items:center;gap:8px;padding:10px;color:white}.days input{width:20px;height:20px;accent-color:#8278ff}.preset{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.preset button{font-size:13px}nav button{min-width:0;flex:1;max-width:110px}.light .week .selected{background:#6559e8;color:white}</style><main><div class="top"><span class="tag">ПАША / 2.3</span><button onclick="theme()" aria-label="Сменить тему">◐</button></div><div id="view"></div></main><nav id="nav"></nav><dialog id="editor"><form id="form"><h2 id="editorTitle">Новое дело</h2><p class="muted">1. Напиши, что нужно сделать. 2. Укажи время. 3. Отметь нужные дни недели. 4. Нажми «Сохранить».</p><label>Что нужно сделать?<input id="name" placeholder="Например: плавание" required maxlength="100"></label><label>Во сколько?<input id="time" type="time" required></label><label>Категория<select id="cat"></select></label><label>В какие дни повторять?</label><div class="preset"><button type="button" onclick="pickDays([0,1,2,3,4,5,6])">Каждый день</button><button type="button" onclick="pickDays([1,2,3,4,5])">Будни</button><button type="button" onclick="pickDays([0,6])">Выходные</button></div><div class="days" id="days"></div><p><button class="primary wide" type="submit">Сохранить в расписание</button> <button type="button" onclick="$('editor').close()">Отмена</button></p><button type="button" id="remove" onclick="del()">Удалить задачу</button></form></dialog><script>
const $=id=>document.getElementById(id), cats=['Утро','Школа','Спорт','Музыка','Дом','Семья','Вечер'], all=[0,1,2,3,4,5,6], seed=[['07:00','Заправить кровать','Утро'],['07:05','Почистить зубы','Утро'],['07:10','Пожелать доброго утра Тае, маме и папе','Семья'],['07:15','Позавтракать','Утро'],['07:30','Проверить рюкзак','Школа'],['15:00','Домашнее задание','Школа'],['16:00','Заняться музыкой','Музыка'],['17:00','Плавание: собрать сумку','Спорт'],['19:00','Помыть посуду','Дом'],['21:30','Подготовиться к завтра','Вечер']];let s;try{s=JSON.parse(localStorage.pasha2)}catch{}s=s||{tasks:seed.map((a,i)=>({id:i+1,time:a[0],name:a[1],cat:a[2],days:i===7?[3]:i===5?[1,2,3,4,5]:all})),done:{},notes:{},goals:[],money:[],light:false};let page=0, date=new Date(), editing=null;const key=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'), esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), save=()=>{localStorage.pasha2=JSON.stringify(s);syncAndroid()}, list=d=>s.tasks.filter(t=>t.days.includes(d.getDay())).sort((a,b)=>a.time.localeCompare(b.time)), checked=(d,t)=>!!s.done[key(d)]?.[t.id], xp=()=>Object.values(s.done).flatMap(Object.values).filter(v=>v===true).length*10;function theme(){s.light=!s.light;save();render()}function toggle(id){let t=s.tasks.find(t=>t.id===id);let a=s.done[key(date)]||={};if(a[id])delete a[id];else a[id]=t.cat==='Семья'?'family':true;save();render()}function tasks(d){return list(d).map(t=>`<div class="task ${checked(d,t)?'done':''}"><input aria-label="Выполнено" type="checkbox" ${checked(d,t)?'checked':''} onchange="toggle(${t.id})"><small>${t.time}</small><span>${esc(t.name)}<br><small>${t.cat}</small></span><button onclick="edit(${t.id})">Изменить</button></div>`).join('')||'<p class="muted">Свободный день</p>'}function render(){document.body.classList.toggle('light',s.light);$('nav').innerHTML=['⌂|Сегодня','▦|Расписание','◈|Прогресс','◎|Цели','€|Деньги'].map((x,i)=>`<button class="${page===i?'active':''}" onclick="go(${i})"><b>${x.split('|')[0]}</b>${x.split('|')[1]}</button>`).join('');let l=list(date), n=l.filter(t=>checked(date,t)).length,p=l.length?Math.round(n/l.length*100):0;let html='';if(page===1){html=schedule()}else if(page===0){html=`<p class="muted">${date.toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'})}</p><h1>${page===0?'Твой день, Паша.':'Твой план'}</h1><p class="muted">Отмечай выполненные дела галочками. Чтобы изменить время или дни занятий, открой расписание.</p><div class="hero"><small>МИССИЯ ДНЯ</small><br><strong>${p}%</strong><div class="bar"><i style="width:${p}%"></i></div>${n} из ${l.length} выполнено</div><button class="primary wide" onclick="go(1)">▦ Моё расписание — настроить</button><div class="top"><button onclick="shift(-1)">‹</button><button onclick="today()">Сегодня</button><button onclick="shift(1)">›</button><button class="primary" onclick="edit()">+ Задача</button></div><section>${tasks(date)}</section><section><h2>Вечерний итог</h2><p class="muted">По желанию запиши пару слов о своём дне. Ответы сохраняются автоматически.</p>${['Что получилось?','Что не успел?','Что сделаю завтра?'].map((q,i)=>`<label>${q}<textarea onchange="note(${i},this.value)">${esc(s.notes[key(date)]?.[i]||'')}</textarea></label>`).join('')}</section>`}else if(page===2){let x=xp(),levels=['Новичок','Организатор','Стратег','Мастер времени','Капитан своей жизни','Легенда'], thresholds=[0,250,500,1000,2500,5000],i=thresholds.filter(v=>v<=x).length-1;html=`<h1>Твой прогресс</h1><p class="muted">Здесь видно, сколько дел ты выполнил. За каждое выполненное дело получаешь 10 XP (очков опыта). Семейные дела не оцениваются баллами.</p><div class="hero"><small>УРОВЕНЬ ${i+1}</small><h2>✦ ${levels[i]}</h2><strong>${x} XP</strong><div class="bar"><i style="width:${i===5?100:100*(x-thresholds[i])/(thresholds[i+1]-thresholds[i])}%"></i></div></div><section><h2>Последние 7 дней</h2>${Array.from({length:7},(_,j)=>{let d=new Date();d.setDate(d.getDate()-6+j);let a=list(d),n=a.filter(t=>checked(d,t)).length;return `<div class="stat"><small>${d.toLocaleDateString('ru',{weekday:'short',day:'numeric'})}</small><div class="bar"><i style="width:${a.length?n/a.length*100:0}%"></i></div>${n}/${a.length}</div>`}).join('')}</section>`}else if(page===3){html=`<h1>Мои цели</h1><p class="muted">Запиши то, чего хочешь достичь: например, выучить песню или улучшить результат в плавании. Когда достигнешь цели, поставь галочку.</p><section><input id="goal" placeholder="Новая цель"><button class="primary" onclick="addGoal()">Добавить</button>${s.goals.map((g,i)=>`<div class="task ${g.done?'done':''}"><input type="checkbox" ${g.done?'checked':''} onchange="s.goals[${i}].done=this.checked;save();render()"><span>${esc(g.name)}</span><button onclick="s.goals.splice(${i},1);save();render()">×</button></div>`).join('')}</section>`}else{html=`<h1>Мои деньги</h1><p class="muted">Это твой личный учёт карманных денег. Записывай, сколько получил и сколько потратил. Настоящие деньги приложение не переводит.</p><div class="hero"><small>БАЛАНС</small><br><strong>${s.money.reduce((a,b)=>a+b.amount,0).toFixed(2)} €</strong></div><section><input id="desc" placeholder="Например: карманные деньги или обед"><input id="amount" type="number" step="0.01" placeholder="Сумма в евро"><button class="primary" onclick="money(1)">Получил деньги</button> <button onclick="money(-1)">Потратил деньги</button>${s.money.map((m,i)=>`<div class="task"><span>${esc(m.name)}</span>${m.amount.toFixed(2)} € <button onclick="s.money.splice(${i},1);save();render()">×</button></div>`).join('')}</section>`}$('view').innerHTML=html}function go(i){page=i;if(i===0)date=new Date();render()}function shift(n){date.setDate(date.getDate()+n);render()}function today(){date=new Date();render()}function note(i,v){(s.notes[key(date)]||={})[i]=v;save()}function addGoal(){let v=$('goal').value.trim();if(v){s.goals.push({name:v,done:false});save();render()}}function money(sign){let a=sign*Math.abs(Number($('amount').value)),n=$('desc').value.trim();if(n&&a&&Number.isFinite(a)){s.money.push({name:n,amount:a});save();render()}}let weekday=new Date().getDay();function pickDays(a){$('days').querySelectorAll('input').forEach(x=>x.checked=a.includes(+x.value))}function schedule(){let names=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];let a=s.tasks.filter(t=>t.days.includes(weekday)).sort((a,b)=>a.time.localeCompare(b.time));return `<h1>Моё расписание</h1><p class="muted">Здесь ты составляешь свою неделю. Выбери день, нажми «Добавить дело», укажи название, время и дни повторения. Нажми «Сохранить». Готово! Чтобы изменить занятие, нажми «Изменить» рядом с ним.</p><p class="muted">Начальное расписание — пример. Установи своё реальное время занятий.</p><div class="week">${[1,2,3,4,5,6,0].map(i=>`<button class="${weekday===i?'selected':''}" onclick="weekday=${i};render()">${names[i].slice(0,2)}<br><small>${s.tasks.filter(t=>t.days.includes(i)).length}</small></button>`).join('')}</div><section><h2>${names[weekday]}</h2><button class="primary wide" onclick="edit()">+ Добавить дело</button>${a.map(t=>`<div class="task"><small>${t.time}</small><span>${esc(t.name)}<br><small>${t.days.length===7?'Каждый день':t.days.map(i=>names[i].slice(0,2)).join(', ')}</small></span><button onclick="edit(${t.id})">Изменить</button></div>`).join('')||'<p>Пока нет дел.</p>'}</section><p class="muted">Изменения действуют на все выбранные дни повторения.</p>`}function edit(id){editing=id??null;let t=s.tasks.find(t=>t.id===id);$('editorTitle').textContent=t?'Изменить дело':'Новое дело';$('name').value=t?.name||'';$('time').value=t?.time||'18:00';$('cat').innerHTML=cats.map(c=>`<option>${c}</option>`).join('');$('cat').value=t?.cat||'Дом';$('days').innerHTML=['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'].map((d,j)=>{let i=(j+1)%7;return `<label><input type="checkbox" value="${i}" ${(t?.days||[page===1?weekday:date.getDay()]).includes(i)?'checked':''}>${d}</label>`}).join('');$('remove').hidden=!t;$('editor').showModal()}$('form').onsubmit=e=>{e.preventDefault();let days=[...$('days').querySelectorAll('input:checked')].map(x=>+x.value);if(!days.length){alert('Выбери хотя бы один день');return}let t={id:editing??Date.now(),name:$('name').value.trim(),time:$('time').value,cat:$('cat').value,days};if(!t.name)return;s.tasks=s.tasks.filter(x=>x.id!==t.id);s.tasks.push(t);save();$('editor').close();render()};function del(){if(confirm('Удалить задачу?')){s.tasks=s.tasks.filter(t=>t.id!==editing);save();$('editor').close();render()}}function syncAndroid(){if(window.Android)Android.schedule(JSON.stringify(s.tasks.map(t=>({...t,title:t.name}))))}syncAndroid();render();</script></html>
